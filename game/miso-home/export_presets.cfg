[preset.0]
name="Android pack"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json"
exclude_filter="art-source/*,production/*,tools/*,README.md,*.py,*.cjs,scripts/check*,scripts/debug*"
