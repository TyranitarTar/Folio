name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore checksum-pinned speech dependencies
        run: |
          python3 bootstrap_ai.py
          python3 bootstrap_supertonic.py
      - name: JVM tests, lint and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
